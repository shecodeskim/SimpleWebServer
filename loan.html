<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loan & Math Calculator</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Page-Specific Styles -->
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background-image: url("assets/images/img4.jpg"); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      background-color: rgba(0, 0, 0, 0.55);
      background-blend-mode: darken;

      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto;
      color: white;
    }

    .calculator-wrapper {
      padding-top: 50px;
      padding-bottom: 50px;
    }

    /* Glass Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    label { color: #f1f1f1; }

    .btn-warning {
      font-weight: 600;
      border-radius: 10px;
    }

    .btn-outline-secondary {
      border-radius: 10px;
      color: white;
      border-color: #ccc;
    }

    .btn-outline-secondary:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Result Card */
    .result-card {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 15px;
      padding: 1.2rem;
      margin-top: 1rem;
      color: #222;
    }

    a.btn-link {
      color: #f8f9fa;
      text-decoration: none;
      font-weight: 500;
    }

    a.btn-link:hover {
      color: #ffc107;
    }
  </style>

</head>
<body>

  <div class="container calculator-wrapper">

    <a href="index.html" class="btn btn-link">← Back to Dashboard</a>

    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="glass-card">

          <div class="text-center mb-3">
            <div class="header-icon">💰</div>
            <h2 class="fw-bold">Loan / EMI Calculator</h2>
            <p class="text-light">Easily compute EMI, total payable & simple interest</p>
          </div>

          <form id="loan-form" class="row g-3">

            <div class="col-md-4">
              <label class="form-label">Principal</label>
              <input id="principal" type="number" min="0" step="0.01" class="form-control" 
                placeholder="e.g., 50000" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Interest Rate (%)</label>
              <input id="rate" type="number" min="0" step="0.01" class="form-control" 
                placeholder="e.g., 7.5" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Tenure (years)</label>
              <input id="tenure" type="number" min="0.1" step="0.1" class="form-control" 
                placeholder="e.g., 2" required>
            </div>

            <div class="col-12 d-flex gap-2 justify-content-center mt-3">
              <button type="submit" class="btn btn-warning px-4">Calculate</button>
              <button id="loan-clear" type="button" class="btn btn-outline-secondary px-4">Clear</button>
            </div>

            <div class="col-12" id="loan-result"></div>

          </form>

        </div>

      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/loan.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
