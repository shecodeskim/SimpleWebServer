<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loan & Math Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <a href="index.html" class="btn btn-link mb-3">← Back</a>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card tool-panel">
          <h4>Loan / EMI Calculator</h4>
          <p class="small-muted">Compute simple interest and monthly EMI.</p>

          <form id="loan-form" class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Principal</label>
              <input id="principal" type="number" min="0" step="0.01" class="form-control" placeholder="e.g., 50000" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Annual Interest Rate (%)</label>
              <input id="rate" type="number" min="0" step="0.01" class="form-control" placeholder="e.g., 7.5" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Tenure (years)</label>
              <input id="tenure" type="number" min="0.1" step="0.1" class="form-control" placeholder="e.g., 2" required>
            </div>

            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-warning">Calculate</button>
              <button id="loan-clear" type="button" class="btn btn-outline-secondary">Clear</button>
            </div>

            <div class="col-12" id="loan-result"></div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/loan.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
