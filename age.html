<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Age Calculator</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background-image: url("assets/images/img5.jpg"); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: rgba(0, 0, 0, 0.55);
      background-blend-mode: darken;

      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto;
      color: #fff;
      margin: 0;
    }

    .section-wrapper {
      padding-top: 60px;
      padding-bottom: 60px;
    }

    /* Glassmorphism card */
    .glass-card {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 25px rgba(0,0,0,0.33);
      animation: fadeIn 0.7s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon-large {
      font-size: 3.2rem;
      margin-bottom: 12px;
    }

    label { color: #fdfdfd; }

    .btn-success {
      font-weight: 600;
      border-radius: 10px;
    }

    .btn-outline-secondary {
      border-radius: 10px;
      color: white;
      border-color: #ccc;
    }

    .btn-outline-secondary:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Result Card */
    .result-card {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 15px;
      padding: 1.2rem;
      margin-top: 1rem;
      color: #222;
    }

    a.btn-link {
      color: #f1f1f1;
      text-decoration: none;
      font-weight: 500;
    }
    a.btn-link:hover {
      color: #0dffb4;
    }
  </style>
</head>

<body>

  <div class="container section-wrapper">
    <a href="index.html" class="btn btn-link">← Back to Dashboard</a>

    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="glass-card">

          <div class="text-center mb-3">
            <div class="icon-large">🎂</div>
            <h2 class="fw-bold">Age Calculator</h2>
            <p class="text-light">Find your exact age in years, months, days — including next birthday countdown.</p>
          </div>

          <form id="age-form" class="row g-3">

            <div class="col-12">
              <label class="form-label">Birthdate</label>
              <input id="birthdate" type="date" class="form-control" required>
            </div>

            <div class="col-12 d-flex justify-content-center gap-2 mt-2">
              <button type="submit" class="btn btn-success px-4">Calculate</button>
              <button id="age-clear" type="button" class="btn btn-outline-secondary px-4">Clear</button>
            </div>

            <div class="col-12" id="age-result"></div>

          </form>

        </div>

      </div>
    </div>

  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/age.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
