<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BMI Calculator</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      background-image: url("assets/images/img2.jpg"); 
      background-size: cover;
      background-position: center;
      backdrop-filter: blur(4px);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 40px 0;
    }

    .card-math {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
      padding: 30px;
      border-left: 5px solid #0d6efd;
    }

    h4 {
      font-weight: 700;
      color: #0d6efd;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.7rem;
    }

    h4::before {
      content: "📘";
      font-size: 1.8rem;
    }

    .small-muted {
      color: #6c757d !important;
      font-size: 0.9rem;
    }

    .btn-primary {
      border-radius: 30px;
      padding: 10px 25px;
    }

    .input-group-text {
      background: #eef3ff;
      font-weight: 600;
      color: #0d6efd;
    }

    label {
      font-weight: 600;
      color: #333;
    }

    #bmi-result {
      padding: 15px;
      background: #f8faff;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px dashed #8e8f90;
      display: none;
      font-size: 1rem;
    }
  </style>

  <link href="assets/css/styles.css" rel="stylesheet">
</head>

<body>

  <div class="container">
    <a href="index.html" class="btn btn-link mb-4 text-decoration-none">
      ← Back to Dashboard
    </a>

    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="card-math">
          <h4>BMI Calculator</h4>
          <p class="small-muted">Enter your weight and height to compute your Body Mass Index (BMI).</p>

          <form id="bmi-form" class="row g-3">

            <!-- Weight -->
            <div class="col-12 col-md-6">
              <label class="form-label">Weight</label>
              <div class="input-group">
                <input id="weight" type="number" min="0" step="0.1" class="form-control" placeholder="e.g., 60" required>
                <span class="input-group-text">kg</span>
              </div>
            </div>

            <!-- Height -->
            <div class="col-12 col-md-6">
              <label class="form-label">Height</label>
              <div class="input-group">
                <input id="height" type="number" min="0" step="0.1" class="form-control" placeholder="e.g., 170" required>
                <select id="height-unit" class="form-select" style="max-width:110px">
                  <option value="cm">cm</option>
                  <option value="m">m</option>
                </select>
              </div>
            </div>

            <!-- Buttons -->
            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-grow-1">Calculate BMI</button>
              <button id="bmi-clear" type="button" class="btn btn-outline-secondary">Clear</button>
            </div>

            <!-- Output -->
            <div class="col-12">
              <div id="bmi-result"></div>
            </div>

          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/bmi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Reveal result box when bmi.js updates it
    document.getElementById("bmi-form").addEventListener("submit", () => {
      document.getElementById("bmi-result").style.display = "block";
    });
  </script>

</body>
</html>
