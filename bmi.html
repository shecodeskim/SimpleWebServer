<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <a href="index.html" class="btn btn-link mb-3">← Back</a>
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card tool-panel">
          <h4>BMI Calculator</h4>
          <p class="small-muted">Enter weight and height — supports kg/cm or kg/m.</p>

          <form id="bmi-form" class="row g-3">
            <div class="col-6">
              <label class="form-label">Weight</label>
              <div class="input-group">
                <input id="weight" type="number" min="0" step="0.1" class="form-control" required>
                <span class="input-group-text">kg</span>
              </div>
            </div>

            <div class="col-6">
              <label class="form-label">Height</label>
              <div class="input-group">
                <input id="height" type="number" min="0" step="0.1" class="form-control" required>
                <select id="height-unit" class="form-select" style="max-width:110px">
                  <option value="cm">cm</option>
                  <option value="m">m</option>
                </select>
              </div>
            </div>

            <div class="col-12 d-flex gap-2">
              <button type="submit" class="btn btn-primary">Calculate BMI</button>
              <button id="bmi-clear" type="button" class="btn btn-outline-secondary">Clear</button>
            </div>

            <div class="col-12" id="bmi-result"></div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/bmi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
