<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Simple Web Server Tools</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #7209b7;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fb;
            color: var(--dark-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            margin-bottom: 2rem;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem;
            flex: 1;
        }
        
        .calculator {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--secondary-color);
        }
        
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e5ee;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        button:hover {
            background: var(--secondary-color);
        }
        
        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .bmi-underweight {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .bmi-normal {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .bmi-overweight {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .bmi-obese {
            background: #f5c6cb;
            color: #721c24;
            border: 1px solid #f1b0b7;
        }
        
        footer {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        .back-button:hover {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>BMI Calculator</h1>
            <p>Calculate your Body Mass Index</p>
        </div>
    </header>

    <div class="container">
        <a href="../index.html" class="back-button">← Back to Tools</a>
        
        <div class="calculator">
            <div class="form-group">
                <label for="height">Height</label>
                <input type="number" id="height" placeholder="Enter height" step="0.01">
                <select id="heightUnit">
                    <option value="cm">Centimeters (cm)</option>
                    <option value="m">Meters (m)</option>
                    <option value="in">Inches (in)</option>
                    <option value="ft">Feet (ft)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="weight">Weight</label>
                <input type="number" id="weight" placeholder="Enter weight" step="0.1">
                <select id="weightUnit">
                    <option value="kg">Kilograms (kg)</option>
                    <option value="lb">Pounds (lb)</option>
                </select>
            </div>
            
            <button onclick="calculateBMI()">Calculate BMI</button>
            
            <div id="result" class="result" style="display: none;"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2025 SimpleWebServer Project</p>
        </div>
    </footer>

    <script>
        function calculateBMI() {
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const heightUnit = document.getElementById('heightUnit').value;
            const weightUnit = document.getElementById('weightUnit').value;
            
            if (!height || !weight) {
                alert('Please enter both height and weight');
                return;
            }
            
            // Convert to metric units
            let heightInMeters = height;
            if (heightUnit === 'cm') heightInMeters = height / 100;
            else if (heightUnit === 'in') heightInMeters = height * 0.0254;
            else if (heightUnit === 'ft') heightInMeters = height * 0.3048;
            
            let weightInKg = weight;
            if (weightUnit === 'lb') weightInKg = weight * 0.453592;
            
            const bmi = weightInKg / (heightInMeters * heightInMeters);
            const roundedBMI = bmi.toFixed(1);
            
            let category = '';
            let resultClass = '';
            
            if (bmi < 18.5) {
                category = 'Underweight';
                resultClass = 'bmi-underweight';
            } else if (bmi < 25) {
                category = 'Normal weight';
                resultClass = 'bmi-normal';
            } else if (bmi < 30) {
                category = 'Overweight';
                resultClass = 'bmi-overweight';
            } else {
                category = 'Obese';
                resultClass = 'bmi-obese';
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <strong>Your BMI: ${roundedBMI}</strong><br>
                <span>Category: ${category}</span>
            `;
            resultDiv.className = `result ${resultClass}`;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
