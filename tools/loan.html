<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator - Simple Web Server Tools</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #7209b7;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fb;
            color: var(--dark-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 3rem 1rem;
            margin-bottom: 2rem;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem;
            flex: 1;
        }
        
        .calculator {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--secondary-color);
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e5ee;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        button:hover {
            background: var(--secondary-color);
        }
        
        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 5px;
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .result-item {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        
        footer {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        .back-button:hover {
            background: var(--secondary-color);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Loan Calculator</h1>
            <p>Calculate your monthly loan payments</p>
        </div>
    </header>

    <div class="container">
        <a href="../index.html" class="back-button">← Back to Tools</a>
        
        <div class="calculator">
            <div class="form-group">
                <label for="loanAmount">Loan Amount ($)</label>
                <input type="number" id="loanAmount" placeholder="Enter loan amount" min="0">
            </div>
            
            <div class="form-group">
                <label for="interestRate">Annual Interest Rate (%)</label>
                <input type="number" id="interestRate" placeholder="Enter interest rate" step="0.01" min="0">
            </div>
            
            <div class="form-group">
                <label for="loanTerm">Loan Term (years)</label>
                <input type="number" id="loanTerm" placeholder="Enter loan term" min="1">
            </div>
            
            <button onclick="calculateLoan()">Calculate Payment</button>
            
            <div id="result" class="result" style="display: none;"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2025 SimpleWebServer Project</p>
        </div>
    </footer>

    <script>
        function calculateLoan() {
            const loanAmount = parseFloat(document.getElementById('loanAmount').value);
            const interestRate = parseFloat(document.getElementById('interestRate').value);
            const loanTerm = parseFloat(document.getElementById('loanTerm').value);
            
            if (!loanAmount || !interestRate || !loanTerm) {
                alert('Please fill in all fields');
                return;
            }
            
            const monthlyInterestRate = (interestRate / 100) / 12;
            const numberOfPayments = loanTerm * 12;
            
            // Calculate monthly payment using the formula
            const monthlyPayment = (loanAmount * monthlyInterestRate) / 
                (1 - Math.pow(1 + monthlyInterestRate, -numberOfPayments));
            
            const totalPayment = monthlyPayment * numberOfPayments;
            const totalInterest = totalPayment - loanAmount;
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="result-item"><strong>Monthly Payment:</strong> $${monthlyPayment.toFixed(2)}</div>
                <div class="result-item"><strong>Total Payment:</strong> $${totalPayment.toFixed(2)}</div>
                <div class="result-item"><strong>Total Interest:</strong> $${totalInterest.toFixed(2)}</div>
                <div class="result-item"><strong>Number of Payments:</strong> ${numberOfPayments}</div>
            `;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
