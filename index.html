<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Math Tools Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
</head>

<body>

    <div class="container">
        <header class="header my-4">
            <h1 class="display-6">Math Tools Server</h1>
            <p class="small-muted">A simple collection of calculators served with Python's HTTP server.</p>
        </header>

        <div class="row g-4">
            <div class="col-sm-6 col-lg-4">
                <a href="bmi.html" class="text-decoration-none text-dark">
                    <div class="card card-tool p-3">
                        <div class="d-flex align-items-center">
                            <div class="me-3 fs-1 text-primary">⚖️</div>
                            <div>
                                <h5 class="mb-1">BMI Calculator</h5>
                                <div class="small-muted">Calculate BMI from height & weight</div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-sm-6 col-lg-4">
                <a href="age.html" class="text-decoration-none text-dark">
                    <div class="card card-tool p-3">
                        <div class="d-flex align-items-center">
                            <div class="me-3 fs-1 text-success">🎂</div>
                            <div>
                                <h5 class="mb-1">Age Calculator</h5>
                                <div class="small-muted">Get age in years, months & days</div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-sm-6 col-lg-4">
                <a href="loan.html" class="text-decoration-none text-dark">
                    <div class="card card-tool p-3">
                        <div class="d-flex align-items-center">
                            <div class="me-3 fs-1 text-warning">💰</div>
                            <div>
                                <h5 class="mb-1">Loan / Math Calculator</h5>
                                <div class="small-muted">EMI, simple interest & totals</div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <footer class="footer">
            <div>Made with 💙 • Serve with <code>python run_server.py</code></div>
        </footer>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
